# Free portfolio hosting: Vercel Hobby + one Render Free web service + Neon Free.
# No Render database/worker/disk and no paid pre-deploy hook.
# Keep the Render workspace on Hobby WITHOUT a payment method (see docs/FREE-HOSTING.md).
services:
  - type: web
    name: yeoun-api
    runtime: python
    region: singapore
    plan: free
    rootDir: apps/api
    buildCommand: pip install -r requirements.lock
    startCommand: python -m yeoun.migrate && exec uvicorn yeoun.main:app --host 0.0.0.0 --port $PORT --no-access-log --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: ENVIRONMENT
        value: production
      - key: DEMO_MODE
        value: "false"
      - key: AUTO_CREATE_SCHEMA
        value: "false"
      - key: RUN_WORKER
        value: "true"
      # Neon DIRECT (non-pooler) TLS URL: migrations hold a session advisory lock.
      - key: DATABASE_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: EXTRA_ORIGINS
        value: ""
      - key: OPENAI_API_KEY
        sync: false
      - key: MODEL_QUICK
        value: gpt-6-sol
      - key: MODEL_STORY
        value: gpt-6-sol
      - key: MODEL_MEMORY
        value: gpt-5.4-mini
      - key: MODEL_FALLBACK
        value: gpt-5.4-mini
