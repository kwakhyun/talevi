name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: yeoun
          POSTGRES_PASSWORD: yeoun
          POSTGRES_DB: yeoun_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U yeoun -d yeoun_test" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm ci
      - run: pip install -r apps/api/requirements.lock
      - run: npm run typecheck
      - run: npm run test:chat-stream
      - run: npm run test:mobile-chat
      - run: npm run build
      - run: npx expo export --platform ios --platform android --output-dir dist
        working-directory: apps/mobile
      - run: ruff check apps/api --select F,I
      - run: alembic upgrade head && alembic check
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+psycopg://yeoun:yeoun@127.0.0.1:5432/yeoun_test
      - run: python -m pytest -q
        working-directory: apps/api
        env:
          TEST_DATABASE_URL: postgresql+psycopg://yeoun:yeoun@127.0.0.1:5432/yeoun_test
