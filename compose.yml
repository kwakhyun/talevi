services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: yeoun
      POSTGRES_DB: yeoun
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong database password}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U yeoun]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    build:
      context: .
      dockerfile: deployment/Dockerfile.api
    env_file: .env.production
    command: [alembic, upgrade, head]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    build:
      context: .
      dockerfile: deployment/Dockerfile.api
    env_file: .env.production
    environment: {RUN_WORKER: 'false'}
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: deployment/Dockerfile.api
    env_file: .env.production
    environment: {RUN_WORKER: 'false'}
    command: [python, -m, yeoun.worker]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: deployment/Dockerfile.web
    depends_on: [api]
    restart: unless-stopped
  gateway:
    image: nginx:1.28-alpine
    volumes: [./deployment/nginx.conf:/etc/nginx/conf.d/default.conf:ro]
    ports: ['127.0.0.1:8080:8080']
    depends_on: [api, web]
    restart: unless-stopped
volumes:
  postgres-data:
